<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEADILAN.CO.ID — Media Daring & Breaking News Ticker</title>
    <meta
      name="description"
      content="Portal berita KEADILAN.CO.ID dengan fitur running text breaking news di bagian atas layar serta kustomisasi durasi dan warna latar belakang."
    />
    <meta property="og:title" content="KEADILAN.CO.ID — Media Daring & Breaking News Ticker" />
    <meta
      property="og:description"
      content="Portal berita KEADILAN.CO.ID dengan fitur running text breaking news di bagian atas layar serta kustomisasi durasi dan warna latar belakang."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('keadilan_dark_mode');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            saved === 'dark' ||
            saved === 'true' ||
            ((saved === null || saved === 'system') && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAF9F6] dark:bg-zinc-950 text-[#1C1917] dark:text-zinc-100 antialiased selection:bg-[#16A085]/20 selection:text-[#0F2A44]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
